<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Allura&amp;family=Great+Vibes&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap');

      .stamp-calligraphy {
        font-family: 'Great Vibes', 'Alex Brush', cursive;
      }
      .stamp-curved-bottom {
        font-family: 'Montserrat', sans-serif;
      }
    </style>

    <!-- Circular Path for Curved Text -->
    <path id="topTextCircle" d="M 68 250 A 182 182 0 0 1 432 250" fill="none" />
    <path id="bottomTextCircle" d="M 432 250 A 182 182 0 0 1 68 250" fill="none" />
    
    <linearGradient id="stampClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C55338" />
      <stop offset="100%" stop-color="#9C3A22" />
    </linearGradient>
  </defs>

  <!-- Outer Scalloped / Vintage Edge Badge -->
  <circle cx="250" cy="250" r="240" fill="#FDFBF7" stroke="#3D291D" stroke-width="2.5" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#C55338" stroke-width="1.2" stroke-dasharray="5 4" />
  <circle cx="250" cy="250" r="148" fill="none" stroke="#3D291D" stroke-width="1.8" />

  <!-- Curved Text Top: Sahila Craft in Calligraphy -->
  <text class="stamp-calligraphy" font-size="36" fill="#3D291D">
    <textPath href="#topTextCircle" startOffset="50%" text-anchor="middle">
      Sahila Craft
    </textPath>
  </text>

  <!-- Star / Botanical Accent on Sides -->
  <text x="56" y="256" font-size="16" fill="#C55338" text-anchor="middle">✦</text>
  <text x="444" y="256" font-size="16" fill="#C55338" text-anchor="middle">✦</text>

  <!-- Curved Text Bottom: TAS RAJUT &amp; KERAJINAN TANGAN -->
  <text class="stamp-curved-bottom" font-size="12" font-weight="600" letter-spacing="4" fill="#C55338">
    <textPath href="#bottomTextCircle" startOffset="50%" text-anchor="middle">
      TAS RAJUT &amp; KERAJINAN TANGAN
    </textPath>
  </text>

  <!-- Center Artwork: Crochet Bag with Yarn Ball and Heart (Dipertahankan) -->
  <g transform="translate(250, 245)">
    <!-- Yarn Ball -->
    <circle cx="-12" cy="10" r="28" fill="#E8B4A2" stroke="#3D291D" stroke-width="2.2"/>
    <path d="M -30 2 C -18 -12, 0 -12, 8 2" stroke="#9C3A22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M -36 12 C -20 0, 0 0, 14 12" stroke="#9C3A22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M -32 22 C -18 12, 0 12, 6 22" stroke="#9C3A22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M -22 -12 C -4 4, 2 24, -8 34" stroke="#FFF7F2" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Crochet Hook (Hakpen) passing through -->
    <g transform="rotate(45 0 0)">
      <rect x="-65" y="-3" width="130" height="6" rx="3" fill="#3D291D"/>
      <path d="M 60 -5 C 68 -5, 72 -2, 70 2 C 68 4, 64 1, 60 1 Z" fill="#3D291D"/>
    </g>

    <!-- Knitted tote bag outline -->
    <path d="M -5 -40 C -5 -55, 35 -55, 35 -40" fill="none" stroke="#3D291D" stroke-width="2.8"/>
    <path d="M -15 -35 C -15 -10, -5 20, 5 25 C 15 28, 45 28, 55 25 C 65 20, 75 -10, 75 -35 Z" fill="#F4EDE4" stroke="#3D291D" stroke-width="2.2"/>
    
    <!-- Bag Knitted Stitches Pattern -->
    <path d="M 0 -22 Q 15 -14, 30 -22 Q 45 -14, 60 -22" fill="none" stroke="#C55338" stroke-width="1.8"/>
    <path d="M 2 -8 Q 17 0, 32 -8 Q 47 0, 58 -8" fill="none" stroke="#C55338" stroke-width="1.8"/>
    <path d="M 8 6 Q 20 14, 32 6 Q 44 14, 52 6" fill="none" stroke="#C55338" stroke-width="1.8"/>

    <!-- Aesthetic Heart -->
    <path d="M 12 55 C 8 45, -5 45, -5 58 C -5 68, 12 78, 12 78 C 12 78, 29 68, 29 58 C 29 45, 16 45, 12 55 Z" fill="#C55338" />
  </g>
</svg>
