<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Allura&amp;family=Great+Vibes&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap');

      .font-calligraphy-main {
        font-family: 'Great Vibes', 'Alex Brush', cursive;
      }
      .font-calligraphy-sub {
        font-family: 'Alex Brush', 'Allura', cursive;
      }
      .font-sans-airy {
        font-family: 'Montserrat', sans-serif;
      }
    </style>

    <linearGradient id="warmRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#C55338" />
    </linearGradient>
    <linearGradient id="softSand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F2E9DE" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#softSand)" />

  <!-- Outer Double Fine Frame -->
  <rect x="25" y="25" width="450" height="450" rx="30" fill="none" stroke="#E2D4C3" stroke-width="1.5" />
  <rect x="35" y="35" width="430" height="430" rx="22" fill="none" stroke="#D1BEAA" stroke-width="0.8" stroke-dasharray="4 4" />

  <!-- Minimalist Icon: Chic Crochet Bag + Continuous Yarn Swirl (Gambar tas dipertahankan) -->
  <g transform="translate(250, 150)" stroke="#3D2B1F" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag Handle -->
    <path d="M -30 -30 C -30 -62, 30 -62, 30 -30" fill="none" stroke="#C55338" stroke-width="4.2" />
    <path d="M -20 -30 C -20 -50, 20 -50, 20 -30" fill="none" stroke="#C55338" stroke-width="2.2" opacity="0.6"/>

    <!-- Bag Body (Knitted / Crochet tote shape) -->
    <path d="M -52 -25 C -55 18, -48 52, -32 62 C -18 68, 18 68, 32 62 C 48 52, 55 18, 52 -25 Z" 
          fill="#FFF9F5" stroke="#3D2B1F" stroke-width="4.2" />

    <!-- Crochet Wave Weave Pattern on Bag -->
    <path d="M -42 -6 Q -22 4, 0 -6 Q 22 -16, 42 -6" fill="none" stroke="#E07A5F" stroke-width="2.8" />
    <path d="M -40 16 Q -22 26, 0 16 Q 22 6, 40 16" fill="none" stroke="#E07A5F" stroke-width="2.8" />
    <path d="M -32 38 Q -18 46, 0 38 Q 18 30, 32 38" fill="none" stroke="#E07A5F" stroke-width="2.8" />

    <!-- Crochet Hook (Hakpen) passing gracefully across the bag -->
    <g transform="rotate(-30 0 0)">
      <path d="M -85 -10 L 75 -10 C 86 -10, 94 -6, 90 -2 C 87 1, 82 -3, 75 -3 L -85 -3 Z" fill="#D4A373" stroke="none" />
      <rect x="-80" y="-12" width="42" height="8" rx="4" fill="#C55338" stroke="none"/>
    </g>

    <!-- Flowing Continuous Yarn String -->
    <path d="M 48 42 C 75 48, 90 18, 70 0 C 55 -15, 42 12, 65 28 C 90 42, 105 75, 80 90 C 60 100, 25 85, 0 90" 
          fill="none" stroke="#E07A5F" stroke-width="2.6" stroke-dasharray="3 3"/>
  </g>

  <!-- AESTHETIC CALLIGRAPHY TYPOGRAPHY (Sahila & Craft Keduanya Kaligrafi) -->
  <!-- "Sahila" & "Craft" in Flowing Calligraphy Script -->
  <g transform="translate(250, 320)">
    <!-- Main Calligraphy Brand Name -->
    <text x="-40" y="0" 
          text-anchor="middle" 
          class="font-calligraphy-main" 
          font-size="68" 
          font-weight="400" 
          fill="#2D2018">
      Sahila
    </text>
    
    <!-- "Craft" also in sweet Calligraphy Flourish -->
    <text x="75" y="6" 
          text-anchor="middle" 
          class="font-calligraphy-sub" 
          font-size="62" 
          font-weight="400" 
          fill="#C55338">
      Craft
    </text>
  </g>

  <!-- Fine Botanical Flourish Divider -->
  <g transform="translate(250, 368)">
    <path d="M -110 0 C -70 -5, -40 5, -20 0" stroke="#8B9D83" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Small Leaf Accent -->
    <path d="M 0 -7 C 5 -2, 5 2, 0 7 C -5 2, -5 -2, 0 -7 Z" fill="#8B9D83" opacity="0.85"/>
    <circle cx="0" cy="0" r="1.5" fill="#FAF7F2" />
    <path d="M 20 0 C 40 -5, 70 5, 110 0" stroke="#8B9D83" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Subtitle Tagline -->
  <text x="250" y="405" 
        text-anchor="middle" 
        class="font-sans-airy" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="4.5" 
        fill="#66564E">
    TAS RAJUT &amp; KERAJINAN TANGAN
  </text>
  
  <!-- Handmade Calligraphy Tagline -->
  <text x="250" y="432" 
        text-anchor="middle" 
        class="font-calligraphy-sub" 
        font-size="28" 
        fill="#A68974">
    Handmade with love
  </text>
</svg>
